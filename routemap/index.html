<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTNH route map</title>

<!-- Link preview card (Discord, Slack, Twitter, iMessage).
     Every one of these unfurlers fetches this page with a plain HTTP client and reads the tags
     below. None of them run JavaScript, so map.js never executes for them and the <title> it
     sets per seed is never seen: what ships here is the whole preview. That also means the card
     is the same for every ?world= -- a per-seed card needs a per-seed HTML file.

     og:image MUST be absolute. A relative path is the single most common reason a card comes up
     as a bare text link; Discord does not resolve it against the page URL.

     Discord caches an unfurl for hours and keys the cache on the *image URL*, so replacing
     preview.jpg in place will not refresh an already-posted link. Bump the ?v= below when the
     card changes. -->
<meta name="description" content="Interactive Greg Tech: New Horizons world map: ore veins, chest loot by value, and points of interest across the Overworld, Nether and Twilight Forest.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="gtnh-seedlib">
<meta property="og:url" content="https://orderedset86.github.io/gtnh-seedlib/routemap/">
<meta property="og:title" content="GTNH Route Map">
<meta property="og:description" content="Interactive Greg Tech: New Horizons world map: ore veins, chest loot by value, and points of interest across the Overworld, Nether and Twilight Forest.">
<meta property="og:image" content="https://orderedset86.github.io/gtnh-seedlib/routemap/preview.jpg?v=1">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Block-level render of the GTNH overworld showing mesa, plains, desert and river biomes.">
<!-- Without this, Twitter and a few others fall back to the small square thumbnail. Discord
     shows the large card off og:image alone, but the tag is harmless there. -->
<meta name="twitter:card" content="summary_large_image">
<!-- Discord tints the embed's left-hand accent stripe with theme-color. -->
<meta name="theme-color" content="#7fb2ff">

<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<div id="map"></div>

<div id="panel">
  <header>
    <h1>Route map</h1>
    <div class="sub" id="worldline">loading&hellip;</div>
  </header>

  <section>
    <h2>Dimension</h2>
    <div class="seg" id="dims"></div>
  </section>

  <section>
    <h2>Base</h2>
    <div class="seg" id="bases"></div>
    <label class="slider">Opacity <input type="range" id="baseopacity" min="0" max="100" value="100"></label>
  </section>

  <section>
    <h2>Ore veins <span class="count" id="veincount"></span></h2>
    <label class="chk"><input type="checkbox" id="veinson" checked> Show veins</label>
    <label class="chk" title="These veins differed between a rows walk and a spiral walk of the same seed. GT vein placement is not a pure function of the seed on this pack, so they may not be there."><input type="checkbox" id="veinunstable"> Include route-unstable</label>
    <label class="slider">Max distance <input type="range" id="veindist" min="0" max="1600" value="1600"><span id="veindistv">1600</span></label>
    <div class="btnrow"><button data-ores="all">All</button><button data-ores="none">None</button></div>
    <div class="list" id="oreList"></div>
  </section>

  <section>
    <h2>Loot <span class="count" id="lootcount"></span></h2>
    <div class="seg" id="lootmode"></div>
    <div id="lootChestOpts">
      <label class="slider">Min chest value <input type="range" id="lootmin" min="0" max="100" step="1" value="0"><input type="number" class="num" id="lootminv" min="0" value="0" step="1" aria-label="Minimum chest value"></label>
      <div class="list" id="srcList"></div>
    </div>
    <div id="lootItemOpts" hidden>
      <input type="search" id="itemsearch" placeholder="Search item, e.g. Bronze Ingot">
      <div class="list" id="itemList"></div>
      <div class="btnrow">
        <button id="itemall">Select all shown</button>
        <button id="itemclear">Clear selection</button>
      </div>
      <div class="note" id="itemcount"></div>
    </div>
  </section>

  <section>
    <h2>POIs</h2>
    <div class="list" id="poiList"></div>
  </section>

  <section id="climatesec" hidden>
    <h2>Climate</h2>
    <label class="chk"><input type="checkbox" id="climate"> Show no-rain / humid regions</label>
    <div class="legend" id="climatelegend" hidden>
      <span><i style="background:#ffc452"></i>no rain</span>
      <span><i style="background:#60f0be"></i>humid</span>
    </div>
  </section>

  <section>
    <h2>Reference</h2>
    <label class="chk"><input type="checkbox" id="rings"> Distance rings from spawn</label>
    <div class="legend" id="ringlegend" hidden></div>
    <label class="slider">Grid
      <select id="grid">
        <option value="off" selected>off</option>
        <option value="16">chunk &mdash; 16</option>
        <option value="256">TF feature grid &mdash; 256</option>
        <option value="512">region / JM tile &mdash; 512</option>
      </select>
    </label>
    <div class="note" id="gridnote"></div>
  </section>

  <section id="caveats"></section>
</div>

<button id="toggle" title="Show/hide panel">&#9776;</button>
<div id="readout"><span id="zoomreadout"></span><span id="posreadout"></span></div>

<!-- ?v= is a cache buster, and it is not optional. A browser will reuse a cached layers.js
     without revalidating even while it refetches map.js, which loads two mismatched halves of the
     app. The symptom is a ReferenceError naming whichever function was just added
     ("setOreDim is not defined") -- it looks like a code bug and is not one. GitHub Pages caches
     at least as hard, so returning visitors hit it after every deploy.
     BUMP THIS whenever layers.js, map.js or style.css changes. -->
<script src="vendor/leaflet.js"></script>
<script src="layers.js?v=2"></script>
<script src="map.js?v=2"></script>
</body>
</html>
