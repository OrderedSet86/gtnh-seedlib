name: Deploy route map to Pages

# Publishes routemap/ plus the worlds/ bundles as a static site.
#
# This deploys through an ARTIFACT rather than by publishing a branch, and that is not a style
# preference: branch-published Pages sites are built from a `git archive`, which contains LFS
# pointer files rather than their contents, so the base map rasters and loot.json would be
# served as ~130 bytes of pointer text and the map would come up blank. Uploading an artifact
# of the checked-out working tree ships the real bytes. It also means visitor traffic never
# touches Git LFS, so the site cannot burn through the LFS bandwidth quota.

on:
  push:
    branches: [main]
    # Only the published files matter; a change to the Streamlit browser or the corpora should
    # not trigger a redeploy.
    paths:
      - 'routemap/**'
      - 'worlds/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-published site is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out without LFS
        uses: actions/checkout@v4
        with:
          # Deliberately NOT lfs: true. That would fetch every LFS object in the repo -- some
          # 264 MB, almost all of it seed-corpus tarballs the site never serves. The next step
          # pulls only what is published.
          lfs: false

      - name: Fetch only the LFS objects the site serves
        run: |
          git lfs install --local
          git lfs pull --include="worlds/**"
          # Fail loudly rather than publishing pointer stubs as if they were images.
          if head -c 40 worlds/*/dim0/base-blocks.png | grep -q 'git-lfs'; then
            echo "::error::LFS objects were not resolved; the site would serve pointer files."
            exit 1
          fi

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r routemap worlds _site/
          # Disable Jekyll: it is not used here, and it silently drops paths it considers
          # special.
          touch _site/.nojekyll
          # The app lives at /routemap/; send the site root there so the published URL works.
          #
          # The Open Graph tags are duplicated from routemap/index.html rather than left to the
          # redirect, because link unfurlers do not follow a meta-refresh -- Discord reads the
          # tags on whatever it fetched and stops. Without them the bare site URL, which is the
          # one people actually paste, unfurls as a plain link while the /routemap/ URL unfurls
          # with a card.
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>GTNH route map</title>
          <meta http-equiv="refresh" content="0; url=routemap/">
          <link rel="canonical" href="routemap/">
          <meta property="og:type" content="website">
          <meta property="og:site_name" content="gtnh-seedlib">
          <meta property="og:url" content="https://orderedset86.github.io/gtnh-seedlib/routemap/">
          <meta property="og:title" content="GTNH Route Map">
          <meta property="og:description" content="Interactive Greg Tech: New Horizons world map: ore veins, chest loot by value, and points of interest across the Overworld, Nether and Twilight Forest.">
          <meta property="og:image" content="https://orderedset86.github.io/gtnh-seedlib/routemap/preview.jpg?v=1">
          <meta property="og:image:type" content="image/jpeg">
          <meta property="og:image:width" content="1200">
          <meta property="og:image:height" content="630">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="theme-color" content="#7fb2ff">
          <p><a href="routemap/">GTNH route map</a></p>
          HTML
          # The card is the only thing most people see before clicking; shipping the site without
          # it is a silent downgrade to a bare text link.
          test -s _site/routemap/preview.jpg || { echo "::error::routemap/preview.jpg missing"; exit 1; }
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
